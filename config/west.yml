#
# ataraxia
#

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: miketronic
      url-base: https://github.com/miketronic
    - name: m165437
      url-base: https://github.com/M165437
    - name: nuovotaka
      url-base: https://github.com/nuovotaka
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: jorgelovesmusic123
      url-base: https://github.com/jorgelovesmusic123

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-keyboards-ataraxia
      remote: jorgelovesmusic123
      revision: 5a1d45c3c212acb6ed0eb0d3affdaab960dc796c # user-tunable-conf branch
      # Our fork of miketronic's ataraxia_v2 branch (from 282c48d, the v2
      # wiring this board needs) with ONE change: the shield's bundled
      # ataraxia.conf no longer sets preference-tuning values (SCROLL_TICK,
      # SNIPE_CPI, accel level/preset). Shield-module .conf fragments merge
      # AFTER config/ataraxia.conf, so those lines silently overrode every
      # tuning attempt in this repo -- config/ataraxia.conf is now the single
      # source of truth for trackball tuning.
    - name: nice-view-gem
      remote: m165437
      revision: v0.3.0
    - name: zmk-pmw3610-driver-02
      remote: jorgelovesmusic123
      revision: 11b2d0b585e0ae44ffd797535b044b99a0cc55d6 # proportional-scroll branch
      # Our fork of miketronic's driver (itself a fork of Inorichi/Kumamuk's),
      # branched from the previously-pinned e2a5c45 with ONE patch on top:
      # scroll reports magnitude proportional to accumulated ball movement
      # (like cursor movement does) instead of a fixed +/-1 tick whose firing
      # rate saturates at the polling rate -- upstream scroll felt locked at
      # one speed no matter how fast the ball moved. With this patch,
      # CONFIG_PMW3610_SCROLL_TICK acts as a true divisor: higher = slower
      # scrolling overall. The binding schema is unchanged from miketronic's
      # (scroll-layers/snipe-layers/automouse-layer), which ataraxia_v2's
      # trackball@0 node requires.
    - name: zmk-pointing-acceleration-alpha
      remote: nuovotaka
      revision: 780dfcd6b796063367893ff41e233773e12fb07c # main HEAD as of 2026-07-02, pinned to stop silent drift
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: 6d8e399cb8ec794f9ade7def4223ceed764c0f14 # pinned before the "Use new selected/preferred
      # endpoint API" commit (21e8004), which calls zmk_endpoint_get_selected() -- a function that
      # doesn't exist in our pinned ZMK v0.3 (only zmk_endpoints_selected()). This commit predates
      # that break and still has ZMK v0.2-era compatibility shims.
      # Required because ataraxia_v2's own default ataraxia.conf sets
      # CONFIG_RGBLED_WIDGET_LAYER_*_COLOR, which is only a defined Kconfig
      # symbol when this module is present -- v2 boards have real status
      # LEDs (led0/led1/led2 in ataraxia.dtsi) this widget drives.

  self:
    path: config
