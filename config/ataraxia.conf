CONFIG_ZMK_KEYBOARD_NAME="ataraxia"
CONFIG_SPI=y

# ----------------------------------------------
# ----------------------------------------------

# BATTERY - Windows battery reporting issue workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# BATTERY - Show peripheral battery
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Enable the Bluetooth BAS (battery reporting service)
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ----------------------------------------------
# ----------------------------------------------

# BLUETOOTH - settings
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# BLUETOOTH - signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y  # Needed for smooth trackball response, per maker's v2 reference config
# CONFIG_BT_CTLR_TX_PWR_MINUS_8=y  #Testing lower power for better battery

# BLUETOOTH - latency between peripherals. Higher value means more latency, but conserves battery.
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Enable support to control external power output
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=16

# BLUETOOTH - Sleep settings
CONFIG_ZMK_SLEEP=y
# Idle timeout (5 hours = 18,000,000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=18000000
# Deep sleep
CONFIG_ZMK_PM_SOFT_OFF=y

# ----------------------------------------------
# ----------------------------------------------

# DEBOUNCE
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ----------------------------------------------
# ----------------------------------------------

# DISPLAY
CONFIG_ZMK_DISPLAY=y
# custom display from https://github.com/M165437/nice-view-gem
# ###CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# disable the WPM widget
CONFIG_ZMK_WIDGET_WPM_STATUS=n
# display battery as n%
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ----------------------------------------------
# ----------------------------------------------

# MACROS - Queue size for large macros
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# ----------------------------------------------
# ----------------------------------------------

# MOUSE
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ----------------------------------------------
# ----------------------------------------------

# STUDIO - disable locking key
CONFIG_ZMK_STUDIO_LOCKING=n

# ----------------------------------------------
# ----------------------------------------------

# RGB WIDGETS
# zmk-rgbled-widget settings -- drives the v2 board's real status LEDs
# (led0/led1/led2 in ataraxia.dtsi). Module's own default ataraxia.conf
# sets RGBLED_WIDGET_LAYER_*_COLOR, which requires this to be enabled.
CONFIG_RGBLED_WIDGET=y

# BlueDrink9 poor mans led indicator
# CONFIG_INDICATOR_LED_WIDGET=y

# ----------------------------------------------
# ----------------------------------------------

# TRACKBALL
# Switched from efogdev's driver to miketronic's zmk-pmw3610-driver-02
# (Inorichi/Kumamuk implementation) -- ataraxia_v2's own trackball@0 node
# uses scroll-layers/snipe-layers/automouse-layer, which only exist in this
# driver's binding, not efogdev's (evt-type/x-input-code/y-input-code).
# Kconfig options below match this driver's actual Kconfig, per the maker's
# own ataraxia_v2 branch reference ataraxia.conf.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1

CONFIG_PMW3610_ORIENTATION_270=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_CPI=200
# Reverted the CPI bump from 1600 back to the driver's 800 default -- cursor
# and scroll speed share this one setting (no independent scroll-speed knob
# in this driver), and raising it made the cursor too fast without a clear
# scroll improvement.
CONFIG_PMW3610_SNIPE_CPI=3200
# The driver fires one fixed-size scroll tick each time accumulated ball
# movement crosses this threshold, then resets the accumulator -- it does
# NOT scale tick size by speed. At 1, virtually any movement (slow or fast)
# crosses it on nearly every sensor poll, so tick rate was already maxed out
# regardless of actual scroll speed. Raised so slower movement takes more
# polls to cross it (fewer/slower ticks) while fast movement still crosses
# it almost immediately (near-max rate), making scroll speed track hand
# speed. Can be tuned further up (less sensitive, more speed range) or down
# (more sensitive, less speed range) based on feel.
CONFIG_PMW3610_SCROLL_TICK=1

CONFIG_PMW3610_POLLING_RATE_125_SW=y

# AUTOMOUSE - the driver auto-deactivates the automouse layer this many ms
# after the ball stops moving (default 400). Bumped way up so it effectively
# never times out on its own; exiting is done manually via a toggle key in
# the AUTOMOUSE_layer instead (see ataraxia.keymap). Moving the ball again
# afterward still re-triggers it immediately, regardless of this value.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=86400000
# Lowered from the driver's default of 5 -- makes it easier for gentle ball
# movement to cross the threshold that triggers automouse-layer activation.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=2

# From zmk-pointing-acceleration-alpha. Enable the acceleration module.
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_SIMPLE=y                 # Level 1: Simple, per maker's v2 reference
CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_HIGH_SENS_TRACKBALL=y   # Trackball (800 DPI)
